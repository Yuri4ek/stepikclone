services:
  db:
    image: postgres:16-alpine
    container_name: stepikclone-db
    environment:
      POSTGRES_USER: stepik
      POSTGRES_PASSWORD: stepik
      POSTGRES_DB: stepikclone
    ports:
      - "5433:5432"
    volumes:
      - stepikclone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepik -d stepikclone"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: lexasigma/stepikclone-backend:latest
    build: ./backend
    container_name: stepikclone-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://stepik:stepik@db:5432/stepikclone
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - SEED_DEMO=${SEED_DEMO:-1}
    volumes:
      - stepikclone_uploads:/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: lexasigma/stepikclone-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: stepikclone-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  stepikclone_pgdata:
  stepikclone_uploads: