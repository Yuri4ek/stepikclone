services:
  db:
    image: postgres:16-alpine
    container_name: stepikclone-db
    environment:
      POSTGRES_USER: stepik
      POSTGRES_PASSWORD: stepik
      POSTGRES_DB: stepikclone
    ports:
      - "5433:5432"
    volumes:
      - stepikclone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepik -d stepikclone"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: stepikclone-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://stepik:stepik@db:5432/stepikclone
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: stepikclone-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  stepikclone_pgdata: